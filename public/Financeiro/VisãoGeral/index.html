<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro</title>
</head>
<body>
    
    <ul>
        <li><a href="/financeiro">Financeiro</a></li>
        <li><a href="/cursos">Cursos</a></li>
        <li><a href="/tarefas">Tarefas</a></li>
        <li><a href="/mentorias">Mentorias</a></li>
        <li><a href="/perfil">Perfil</a></li>
    </ul>

    <h1>Financeiro - teste do backend</h1>

    <h2>Adicionar movimentação</h2>

    <form id="formFinanceiro">
        <input id="descricao" placeholder="Descrição" required>
        <input id="valor" type="number" step="0.01" placeholder="Valor" required>

        <select id="tipo">
            <option value="entrada">Entrada</option>
            <option value="saida">Saída</option>
        </select>

        <input id="data" type="date" required>
        <button type="submit"> Adicionar</button>
    </form>
    <hr>

    <h2>Resumo</h2>

    <button onclick="carregarResumo()">
        Carregar resumo
    </button>

    <pre id="resumo"></pre>


    <h2>Movimentações</h2>

    <button onclick="carregarMovimentacoes()">
        Carregar movimentações
    </button>

    <pre id="movimentacoes"></pre>

    <script src="../../scripts/financas.js"></script>

</body>

</html>
