<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu MEI</title>
</head>
<body>

    <nav class="menu-meu-mei">
    <a href="/visaoGeral" class="menu-meu-mei__item">Meu Mei</a>
    <a href="/obrigacoes" class="menu-meu-mei__item">Obrigações</a>
    <a href="/guias" class="menu-meu-mei__item">Guias</a>
    </nav>
    
    <h1>Meu Mei</h1>

    <!-- ================= Meu negócio ================= -->
    <section class="secao-negocio">
        <h2>Meu negócio</h2>

        <!-- Card de visualização: mostra os dados salvos (ou "Não informado" pro que falta) -->
        <div id="cardNegocio" class="card-negocio">
            <p class="card-negocio__usuario"></p>
            <p class="card-negocio__nome"></p>
            <p class="card-negocio__cnpj"></p>
            <p class="card-negocio__situacao"></p>
            <button id="btnEditarNegocio">Editar informações</button>
        </div>

        <!-- Formulário de edição: escondido até o usuário clicar em "Editar informações" -->
        <form id="formNegocio" hidden>
            <label for="nome_negocio">Nome do negócio:</label>
            <input type="text" name="nome_negocio">

            <label for="cnpj">CNPJ:</label>
            <input type="text" name="cnpj" placeholder="00.000.000/0001-00">

            <label for="situacao">Situação:</label>
            <select name="situacao">
                <option value="">Selecione</option>
                <option value="Mei Ativo">Mei Ativo</option>
                <option value="Mei Inativo">Mei Inativo</option>
                <option value="Pendente de regularização">Pendente de regularização</option>
            </select>

            <button type="submit" id="btnSalvarNegocio">Salvar</button>
            <button type="button" id="btnCancelarEdicao">Cancelar</button>
        </form>

        <p id="negocioMensagem"></p>
    </section>

    <!-- ================= Prévia de obrigações ================= -->
    <section class="secao-obrigacoes">
        <h2>Suas obrigações</h2>

        <template id="template-obrigacao-preview">
            <div class="card-obrigacao">
                <h3 class="card-obrigacao__titulo"></h3>
                <span class="card-obrigacao__status"></span>
                <p class="card-obrigacao__vencimento"></p>
                <a class="card-obrigacao__link" target="_blank">Ver como emitir ›</a>
            </div>
        </template>

        <div id="lista-obrigacoes-preview"></div>
        <a href="/obrigacoes">Ver todos</a>
    </section>

    <!-- ================= Prévia de guias ================= -->
    <section class="secao-guias">
    <h2>Guia do MEI</h2>

    <a href="https://www.gov.br/empresas-e-negocios/pt-br/empreendedor/quero-ser-mei">Como abrir um MEI</a>
    <a href="https://www.gov.br/pt-br/servicos/emitir-das-para-pagamento-de-tributos-do-mei">Como emitir DAS</a>
    <a href="https://www.gov.br/empresas-e-negocios/pt-br/empreendedor/servicos-para-mei/declaracao-anual-de-faturamento">Declaração Anual</a>
    <a href="https://www.gov.br/empresas-e-negocios/pt-br/empreendedor/quero-ser-mei/direitos-e-obrigacoes">Direitos e obrigações</a>

    <a href="/guias">Ver todos</a>
    </section>

    <script type="module" src="/scripts/meuMei.js"></script>
</body>
</html>
