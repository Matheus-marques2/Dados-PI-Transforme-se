<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos</title>
</head>
<body>
    <!-- exibir os dados do perfil -->
    <h2>Meu Perfil</h2>

    <label for="nome">Nome:</label>

    <label for="email">E-mail:</label>
    <input type="email" name="email">

    <label for="pronome">Pronome:</label>

    <label for="sobre">Sobre mim:</label>
    <textarea name="sobre"></textarea>

    <button id="btnSalvar">Salvar alterações</button>

    <script type="module" src="/scripts/perfil.js"></script>
</body>
